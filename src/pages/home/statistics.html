<!--
  Santa Chimney Sweep
  Professional Service Statistics

  Block 17 controls the number counters and reveal behavior.
  Confirm every statistic with the business owner before publishing.
-->



<section class="scs-lp scs-lp--dark" id="scs-service-stats" aria-labelledby="scs-service-stats-title" data-scs-counter-group="">
  <div class="scs-lp__container">
    <div class="scs-stats-pro__layout">

      <header class="scs-stats-pro__intro" data-scs-reveal="left">
        <span class="scs-stats-pro__eyebrow">
          Service Experience
        </span>

        <h2 class="scs-stats-pro__title" id="scs-service-stats-title">
          Chimney Care Experience in Numbers

        <p class="scs-stats-pro__description">
          A summary of the inspection, sweeping, and repair experience
          supporting Santa Chimney Sweep’s service.
        </p>
      </header>

      <div class="scs-stats-pro__panel" aria-label="Santa Chimney Sweep service statistics" data-scs-reveal="right">

        <!-- Confirm this figure with the business owner before publishing. -->
        <article class="scs-stats-pro__item" aria-label="831 chimney inspections">

              <path d="M3 21h18"></path>
              <path d="M5 21V9l7-5 7 5v3"></path>

              <path d="m14.2 15.5.9.9 1.8-2"></path>
            </svg>
          </span>

          <span class="scs-stats-pro__number" data-scs-counter="" data-scs-end="831" data-scs-format="comma">
            831
          </span>

          <span class="scs-stats-pro__label">
            Chimney Inspections
          </span>
        </article>

        <!-- Confirm this figure with the business owner before publishing. -->
        <article class="scs-stats-pro__item" aria-label="More than 20 years of experience">
          <span class="scs-stats-pro__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </span>

          <span class="scs-stats-pro__number" data-scs-counter="" data-scs-end="20" data-scs-suffix="+">
            20+

          <span class="scs-stats-pro__label">
            Years of Experience
          </span>
        </article>

        <!-- Confirm this figure with the business owner before publishing. -->
        <article class="scs-stats-pro__item" aria-label="1,478 chimneys swept">
          <span class="scs-stats-pro__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m14.5 3 6.5 6.5"></path>
              <path d="m12.2 5.3 6.5 6.5"></path>
              <path d="m5 19 9.6-9.6"></path>

          <span class="scs-stats-pro__number" data-scs-counter="" data-scs-end="1478" data-scs-format="comma">
